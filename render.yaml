services:
  - type: web
    name: theghostweb
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: theghostweb
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@nroghost.com
      - key: EMAIL_FROM_NAME
        value: TheGhost Coder
      - key: EMAIL_REPLY_TO
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
