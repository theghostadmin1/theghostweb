<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d18"/>
      <stop offset="50%" stop-color="#1f1138"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle cyber grid lines -->
  <g stroke="rgba(168,85,247,0.12)" stroke-width="1.5">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Glowing Aura Background Circle -->
  <circle cx="400" cy="200" r="110" fill="rgba(168,85,247,0.12)" filter="url(#glow)"/>
  
  <!-- Center Hexagon / Icon Circle -->
  <circle cx="400" cy="185" r="58" fill="rgba(26,26,46,0.9)" stroke="url(#purpleGlow)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Download arrow icon inside -->
  <path d="M400 152 V210" stroke="#f3e8ff" stroke-width="6" stroke-linecap="round"/>
  <path d="M375 190 L400 215 L425 190" fill="none" stroke="#f3e8ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="370" y1="228" x2="430" y2="228" stroke="url(#purpleGlow)" stroke-width="5" stroke-linecap="round"/>

  <!-- Typography -->
  <text x="400" y="295" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" letter-spacing="1">THEGHOST OFFICIAL</text>
  <text x="400" y="330" text-anchor="middle" fill="#a855f7" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="3">SECURE DOWNLOAD PACKAGE</text>
</svg>
